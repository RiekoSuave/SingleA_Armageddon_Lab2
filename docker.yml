# =============================================================================
# Dockerfile — Lab 2 Static Site Container
# Mirrors the EC2 User Data setup: Nginx serving index.html on port 80.
#
# Build:   docker build -t lab2-site .
# Run:     docker run -p 8080:80 lab2-site
# Compose: docker compose up
# =============================================================================

# ── Stage 1: generate the site with Python ───────────────────────────────────
FROM python:3.12-slim AS builder

WORKDIR /build

# Copy only the generator — keeps the builder layer small
COPY lab2_enhance.py .

# Run the generator (no boto3/validation needed here)
RUN python3 lab2_enhance.py --name "Your Name Here"
# Output lands in /build/lab2_output/index.html


# ── Stage 2: serve with Nginx ─────────────────────────────────────────────────
FROM nginx:1.27-alpine AS runtime

LABEL maintainer="student@example.com"
LABEL description="Lab 2 — EC2 User Data Automation (containerised mirror)"

# Replace the default Nginx welcome page with our generated site
COPY --from=builder /build/lab2_output/index.html /usr/share/nginx/html/index.html

# Optional: tighten Nginx config (remove default server_tokens, add gzip)
RUN printf '\
server {\n\
    listen 80;\n\
    server_name _;\n\
    root /usr/share/nginx/html;\n\
    index index.html;\n\
    server_tokens off;\n\
    gzip on;\n\
    gzip_types text/html text/css application/javascript;\n\
    location / {\n\
        try_files $uri $uri/ =404;\n\
    }\n\
}\n' > /etc/nginx/conf.d/default.conf

EXPOSE 80

HEALTHCHECK --interval=30s --timeout=5s --start-period=5s --retries=3 \
    CMD wget -qO- http://localhost/ || exit 1

CMD ["nginx", "-g", "daemon off;"]

---
